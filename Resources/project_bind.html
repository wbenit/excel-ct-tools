<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>绑定 DrawCode 云端工程项目</title>
  <!-- 引入 Vue 3 核心库 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- 引入 Element Plus 样式库 -->
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <!-- 引入 Element Plus 核心组件库 -->
  <script src="https://unpkg.com/element-plus"></script>
  <!-- 引入 Element Plus 图标库 -->
  <script src="https://unpkg.com/@element-plus/icons-vue"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      padding: 16px;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 60%, #172554 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #ffffff;
      user-select: none;
    }

    .main-container {
      max-width: 500px;
      margin: 0 auto;
    }

    /* 顶部工程信息玻璃拟态卡片 */
    .info-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .info-title {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .info-highlight {
      font-size: 15px;
      font-weight: 600;
      color: #38bdf8;
      word-break: break-all;
    }

    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      margin-top: 6px;
    }
    .badge-bound {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .badge-unbound {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    /* 项目列表容器 */
    .project-list-box {
      max-height: 280px;
      overflow-y: auto;
      margin-top: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(15, 23, 42, 0.6);
    }

    .project-item {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .project-item:last-child {
      border-bottom: none;
    }

    .project-item:hover {
      background: rgba(99, 102, 241, 0.15);
    }

    .project-item.is-selected {
      background: rgba(99, 102, 241, 0.3);
      border-left: 3px solid #818cf8;
    }

    .proj-name {
      font-size: 14px;
      font-weight: 500;
      color: #f1f5f9;
    }

    .proj-meta {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .proj-tag {
      font-size: 12px;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* 覆写 Element 表单暗色风格 */
    .el-input__wrapper {
      background-color: rgba(15, 23, 42, 0.8) !important;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2) inset !important;
      border-radius: 8px !important;
    }

    .el-input__inner {
      color: #ffffff !important;
    }

    .btn-submit {
      width: 100%;
      height: 42px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      border: none;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
      margin-top: 16px;
    }

    .btn-submit:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="bind-template">
    <div class="main-container">
      <!-- 顶部当前文件与识别结果 -->
      <div class="info-card">
        <div class="info-title">当前活动工作簿文件</div>
        <div style="font-size: 13px; color: #cbd5e1; margin-bottom: 8px;">{{ context.workbookName }}</div>
        
        <div class="info-title">智能提取的项目名称</div>
        <div class="info-highlight">{{ context.candidateName || '未能自动提取' }}</div>

        <div style="margin-top: 8px;">
          <span v-if="context.boundProjectId > 0" class="status-badge badge-bound">
            ✔ 已绑定项目：{{ context.boundProjectName }} (ID: {{ context.boundProjectId }})
          </span>
          <span v-else class="status-badge badge-unbound">
            ⚡ 尚未绑定云端项目
          </span>
        </div>
      </div>

      <!-- 搜索与匹配区域 -->
      <div style="display: flex; gap: 8px;">
        <el-input
          v-model="searchKeyword"
          placeholder="输入项目名称搜索云端项目..."
          size="default"
          :prefix-icon="Search"
          clearable
          @keyup.enter="handleSearch"
        />
        <el-button type="primary" :loading="searching" @click="handleSearch">
          搜索
        </el-button>
      </div>

      <!-- 项目选择列表 -->
      <div class="project-list-box" v-loading="searching">
        <div v-if="projects.length === 0" style="text-align: center; padding: 24px; color: #94a3b8; font-size: 13px;">
          暂无匹配的云端项目，请输入关键词搜索
        </div>
        <div
          v-for="p in projects"
          :key="p.id"
          class="project-item"
          :class="{ 'is-selected': selectedProjectId === p.id }"
          @click="selectProject(p)"
        >
          <div>
            <div class="proj-name">{{ p.projectName }}</div>
            <div class="proj-meta">ID: {{ p.id }} · 类型: {{ p.projectType || '常规成套' }}</div>
          </div>
          <div class="proj-tag">
            <span v-if="selectedProjectId === p.id" style="color: #38bdf8; font-weight: bold;">✔ 已选</span>
            <span v-else>选择</span>
          </div>
        </div>
      </div>

      <!-- 底部提交操作 -->
      <el-button
        type="primary"
        class="btn-submit"
        :loading="submitting"
        :disabled="!selectedProjectId"
        @click="handleConfirmBind"
      >
        {{ submitting ? '正在绑定写入工作簿...' : '确认绑定此项目到当前工作簿' }}
      </el-button>
    </div>
  </script>

  <script setup>
    const { ref, reactive, onMounted } = Vue;
    const { Search } = ElementPlusIconsVue;

    const context = reactive({
      workbookName: '正在探测...',
      candidateName: '',
      currentGroupId: 0,
      currentGroupName: '',
      boundProjectId: 0,
      boundProjectName: ''
    });

    const searchKeyword = ref('');
    const searching = ref(false);
    const submitting = ref(false);
    const projects = ref([]);
    const selectedProjectId = ref(null);
    const selectedProjectName = ref('');

    onMounted(() => {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.addEventListener('message', (event) => {
          const res = event.data;

          if (res.action === 'initContextResult') {
            context.workbookName = res.workbookName;
            context.candidateName = res.candidateName;
            context.currentGroupId = res.currentGroupId;
            context.currentGroupName = res.currentGroupName;
            context.boundProjectId = res.boundProjectId;
            context.boundProjectName = res.boundProjectName;

            searchKeyword.value = res.candidateName || '';
            selectedProjectId.value = res.boundProjectId > 0 ? res.boundProjectId : null;
            selectedProjectName.value = res.boundProjectName || '';

            // 自动触发一次以候选词为准的云端搜索
            handleSearch();
          }
          else if (res.action === 'searchProjectsResult') {
            searching.value = false;
            if (res.success) {
              projects.value = res.projects || [];
              if (selectedProjectId.value) {
                const found = projects.value.find(p => p.id === selectedProjectId.value);
                if (found) selectedProjectName.value = found.projectName;
              } else if (projects.value.length > 0) {
                // 默认高亮第一个
                selectedProjectId.value = projects.value[0].id;
                selectedProjectName.value = projects.value[0].projectName;
              }
            } else {
              ElementPlus.ElMessage.error(res.message || '搜索失败');
            }
          }
          else if (res.action === 'bindProjectResult') {
            submitting.value = false;
            if (res.success) {
              ElementPlus.ElMessage.success(res.message || '绑定成功！');
            } else {
              ElementPlus.ElMessage.error(res.message || '绑定失败！');
            }
          }
        });

        // 主动请求初始化上下文
        window.chrome.webview.postMessage({ action: 'getInitContext' });
      }
    });

    const handleSearch = () => {
      searching.value = true;
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({
          action: 'searchProjects',
          keyword: searchKeyword.value
        });
      }
    };

    const selectProject = (p) => {
      selectedProjectId.value = p.id;
      selectedProjectName.value = p.projectName;
    };

    const handleConfirmBind = () => {
      if (!selectedProjectId.value) return;
      submitting.value = true;
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({
          action: 'bindProject',
          projectId: selectedProjectId.value,
          projectName: selectedProjectName.value
        });
      }
    };
  </script>

  <script>
    (function() {
      const templateText = document.getElementById('bind-template').innerHTML;
      const setupScriptText = document.querySelector('script[setup]').textContent;

      const Component = {
        template: templateText,
        setup() {
          const setupFunc = new Function('Vue', 'ElementPlusIconsVue', `
            ${setupScriptText}
            return {
              context, searchKeyword, searching, submitting, projects,
              selectedProjectId, selectedProjectName, handleSearch, selectProject,
              handleConfirmBind, Search
            };
          `);
          return setupFunc(Vue, ElementPlusIconsVue);
        }
      };

      const app = Vue.createApp(Component);
      app.use(ElementPlus);
      app.mount('#app');
    })();
  </script>
</body>
</html>
