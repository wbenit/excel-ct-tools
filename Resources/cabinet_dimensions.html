<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生成尺寸安装方式表 - 选择分类表</title>
  <!-- 引入 Element Plus 样式库 -->
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <!-- 引入 Font Awesome 矢量图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- 引入 Vue 3 核心库 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- 引入 Element Plus 核心组件库 -->
  <script src="https://unpkg.com/element-plus"></script>
  <style>
    /* 全局盒模型重置与防外溢 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 页面基底弹性布局，禁止页面级滚动 */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
      user-select: none;
      background-color: #f8fafc;
      color: #334155;
    }

    /* 主应用容器，弹性垂直布局，坚决杜绝水平滚动条 */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
      overflow: hidden;
    }

    /* 顶部无边框原生拖拽标题栏 (主色调 #009688，绿蓝渐变) */
    .window-header {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: linear-gradient(135deg, #009688 0%, #00796b 100%);
      color: #ffffff;
      cursor: move;
      flex-shrink: 0;
      touch-action: none;
      box-shadow: 0 2px 4px rgba(0, 150, 136, 0.15);
    }

    /* 标题区域 */
    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    /* 窗口右上角关闭按钮 */
    .header-actions {
      display: flex;
      align-items: center;
    }

    .close-btn {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      cursor: pointer;
      color: #e0f2f1;
      transition: all 0.2s;
    }

    .close-btn:hover {
      background-color: rgba(239, 68, 68, 0.85);
      color: #ffffff;
    }

    /* 主内容区域，弹性伸缩 */
    .window-body {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
      background-color: #f8fafc;
    }

    /* 工程信息展示卡片 */
    .project-info-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #475569;
    }

    .info-label {
      color: #64748b;
    }

    .info-value {
      font-weight: 600;
      color: #0f172a;
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 覆盖警示提示条 */
    .overwrite-alert {
      background-color: #fffbeb;
      border: 1px solid #fef3c7;
      color: #b45309;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
    }

    /* 快捷操作栏 (全选与反选) */
    .select-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      font-size: 12px;
      color: #64748b;
    }

    .select-links {
      display: flex;
      gap: 12px;
    }

    .action-link {
      cursor: pointer;
      color: #009688;
      transition: color 0.15s;
    }

    .action-link:hover {
      color: #00796b;
      text-decoration: underline;
    }

    /* 分类列表滚动区域 */
    .categories-list {
      flex: 1;
      min-height: 140px;
      max-height: 180px;
      overflow-y: auto;
      overflow-x: hidden;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* 分类复选框单项卡片 */
    .category-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 4px;
      transition: background 0.15s;
      cursor: pointer;
    }

    .category-item:hover {
      background-color: #f1f5f9;
    }

    .category-item.selected {
      background-color: #e6f7f5;
    }

    .cat-name-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
    }

    .cab-count-tag {
      font-size: 11px;
      background: #f1f5f9;
      color: #475569;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    .category-item.selected .cab-count-tag {
      background: #b2dfdb;
      color: #004d40;
    }

    /* 底部操作栏 */
    .window-footer {
      height: 52px;
      padding: 0 16px;
      background-color: #ffffff;
      border-top: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .footer-summary {
      font-size: 12px;
      color: #64748b;
    }

    .footer-summary strong {
      color: #009688;
      font-weight: 700;
    }

    .footer-btns {
      display: flex;
      gap: 8px;
    }

    /* 主色调主题覆盖定制 */
    .el-button--primary {
      --el-button-bg-color: #009688;
      --el-button-border-color: #009688;
      --el-button-hover-bg-color: #00796b;
      --el-button-hover-border-color: #00796b;
      --el-button-active-bg-color: #004d40;
      --el-button-active-border-color: #004d40;
    }

    .el-checkbox {
      --el-checkbox-checked-bg-color: #009688;
      --el-checkbox-checked-input-border-color: #009688;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 顶部拖拽标题栏 -->
    <div class="window-header" @mousedown="startDrag">
      <div class="header-title">
        <i class="fa-solid fa-ruler-combined"></i>
        <span>生成尺寸安装方式表 - 选择分类表</span>
      </div>
      <div class="header-actions">
        <div class="close-btn" @click="closeWindow" title="关闭窗口">
          <i class="fa-solid fa-xmark"></i>
        </div>
      </div>
    </div>

    <!-- 主体区域 -->
    <div class="window-body" v-loading="loading" element-loading-text="正在读取分类明细箱柜数据...">
      <!-- 工程项目基础信息卡片 -->
      <div class="project-info-card">
        <div class="info-item">
          <i class="fa-solid fa-folder-open" style="color: #009688;"></i>
          <span class="info-label">工程项目:</span>
          <span class="info-value" :title="projectName">{{ projectName || '未命名项目' }}</span>
        </div>
        <div class="info-item">
          <i class="fa-solid fa-cubes" style="color: #009688;"></i>
          <span class="info-label">有效分类表:</span>
          <span class="info-value">{{ categories.length }} 个</span>
        </div>
      </div>

      <!-- 覆盖提醒条 (若当前已存在尺寸安装方式表) -->
      <div class="overwrite-alert" v-if="hasExistingDimensionsSheet">
        <i class="fa-solid fa-triangle-exclamation" style="margin-right: 4px;"></i>
        当前工作簿已存在【尺寸安装方式】工作表，重新生成将覆盖并重置该表数据。
      </div>

      <!-- 快捷操作栏 -->
      <div class="select-actions">
        <span>请勾选需要生成尺寸安装方式的分类表：</span>
        <div class="select-links">
          <span class="action-link" @click="selectAll">全选</span>
          <span class="action-link" @click="selectNone">清空</span>
          <span class="action-link" @click="selectInverse">反选</span>
        </div>
      </div>

      <!-- 分类复选列表 -->
      <div class="categories-list">
        <div
          v-for="cat in categories"
          :key="cat.sheetName"
          class="category-item"
          :class="{ selected: cat.isSelected }"
          @click="toggleSelect(cat)"
        >
          <div class="cat-name-box">
            <el-checkbox v-model="cat.isSelected" @click.stop></el-checkbox>
            <span>{{ cat.sheetName }}</span>
          </div>
          <div class="cab-count-tag">
            {{ cat.cabinetCount }} 台箱柜
          </div>
        </div>
      </div>
    </div>

    <!-- 底部操作按钮栏 -->
    <div class="window-footer">
      <div class="footer-summary">
        已选 <strong>{{ selectedCategoryCount }}</strong> 个分类表，共 <strong>{{ selectedCabinetCount }}</strong> 台箱柜
      </div>
      <div class="footer-btns">
        <el-button size="default" @click="closeWindow" :disabled="exporting">取消</el-button>
        <el-button
          type="primary"
          size="default"
          :loading="exporting"
          :disabled="selectedCategoryCount === 0 || loading"
          @click="confirmExport"
        >
          <i class="fa-solid fa-file-export" style="margin-right: 6px;" v-if="!exporting"></i>
          立即生成尺寸表
        </el-button>
      </div>
    </div>
  </div>

  <script type="module">
    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
      setup() {
        // 状态定义
        const loading = ref(true);
        const exporting = ref(false);
        const projectName = ref('');
        const hasExistingDimensionsSheet = ref(false);
        const categories = ref([]);

        // 计算属性：选中的分类表数量
        const selectedCategoryCount = computed(() => {
          return categories.value.filter(c => c.isSelected).length;
        });

        // 计算属性：选中的箱柜总台数
        const selectedCabinetCount = computed(() => {
          return categories.value
            .filter(c => c.isSelected)
            .reduce((sum, c) => sum + (c.cabinetCount || 0), 0);
        });

        // 向 C# 发送指令
        const postToCSharp = (payload) => {
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(payload);
          }
        };

        // 监听 C# 投递的消息
        const setupMessageListener = () => {
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', (event) => {
              let res = event.data;
              if (typeof res === 'string') {
                try { res = JSON.parse(res); } catch (e) {}
              }
              if (!res || !res.action) return;

              switch (res.action) {
                case 'initDataLoaded':
                  loading.value = false;
                  projectName.value = res.projectName || '';
                  hasExistingDimensionsSheet.value = !!res.hasExistingDimensionsSheet;
                  categories.value = (res.categories || []).map(c => ({
                    ...c,
                    isSelected: true
                  }));
                  break;

                case 'exportCompleted':
                  exporting.value = false;
                  if (res.success) {
                    ElementPlus.ElMessage.success({
                      message: `成套设备【尺寸安装方式】生成成功！共计 ${res.cabinetCount} 台箱柜。`,
                      duration: 1500
                    });
                    setTimeout(() => {
                      postToCSharp({ action: 'closeWindow' });
                    }, 1200);
                  } else {
                    ElementPlus.ElMessage.error(res.message || '导出尺寸安装方式表失败');
                  }
                  break;
              }
            });
          }
        };

        // 切换单项选择状态
        const toggleSelect = (cat) => {
          cat.isSelected = !cat.isSelected;
        };

        // 全选
        const selectAll = () => {
          categories.value.forEach(c => c.isSelected = true);
        };

        // 清空
        const selectNone = () => {
          categories.value.forEach(c => c.isSelected = false);
        };

        // 反选
        const selectInverse = () => {
          categories.value.forEach(c => c.isSelected = !c.isSelected);
        };

        // 提交导出
        const confirmExport = () => {
          const selected = categories.value
            .filter(c => c.isSelected)
            .map(c => c.sheetName);

          if (selected.length === 0) {
            ElementPlus.ElMessage.warning('请至少选择一个分类明细表！');
            return;
          }

          exporting.value = true;
          postToCSharp({
            action: 'exportCabinetDimensions',
            selectedCategories: selected
          });
        };

        // 窗口拖拽
        const startDrag = () => {
          postToCSharp({ action: 'dragWindow' });
        };

        // 关闭窗口
        const closeWindow = () => {
          postToCSharp({ action: 'closeWindow' });
        };

        onMounted(() => {
          setupMessageListener();
          // 向 C# 请求初始化数据
          postToCSharp({ action: 'getInitData' });
        });

        return {
          loading,
          exporting,
          projectName,
          hasExistingDimensionsSheet,
          categories,
          selectedCategoryCount,
          selectedCabinetCount,
          toggleSelect,
          selectAll,
          selectNone,
          selectInverse,
          confirmExport,
          startDrag,
          closeWindow
        };
      }
    }).use(ElementPlus).mount('#app');
  </script>
</body>
</html>
