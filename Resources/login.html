<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户登录与工作组选择</title>
  <!-- 引入 Vue 3 核心库 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- 引入 Element Plus 样式库 -->
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <!-- 引入 Element Plus 核心组件库 -->
  <script src="https://unpkg.com/element-plus"></script>
  <!-- 引入 Element Plus 图标库 -->
  <script src="https://unpkg.com/@element-plus/icons-vue"></script>

  <style>
    /* 全局盒模型重置与防止横向滚动条溢出 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 页面背景使用高端深邃的绿蓝相间渐变光晕 */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      /* 深邃绿蓝暗夜质感主背景 */
      background: radial-gradient(circle at 50% 10%, #0f3d38 0%, #0a2926 40%, #051716 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      /* 严格杜绝水平滚动条溢出 */
      overflow: hidden !important;
      max-width: 100vw;
      user-select: none;
    }

    /* 绿蓝相间高端玻璃拟态卡片容器 */
    .login-card {
      width: 400px;
      border-radius: 18px !important;
      /* 深翠暗绿半透明磨砂背景 */
      background: rgba(8, 30, 28, 0.75) !important;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      /* 精致的青绿发光边框 */
      border: 1px solid rgba(0, 150, 136, 0.35) !important;
      /* 复合深邃阴影与青绿光晕扩散 */
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 150, 136, 0.15) !important;
      padding: 10px 10px 18px 10px;
      color: #ffffff;
      transition: all 0.3s ease;
    }

    /* 顶部头部标识排版 */
    .header-title {
      text-align: center;
      margin-bottom: 22px;
      color: #ffffff;
    }

    /* 绿蓝相间渐变 Logo 容器 */
    .header-title .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      /* 核心主色调 #009688 到湖蓝渐变 */
      background: linear-gradient(135deg, #009688 0%, #00b4d8 100%);
      border-radius: 16px;
      margin-bottom: 12px;
      /* 精致 Logo 发光外投影 */
      box-shadow: 0 8px 22px rgba(0, 150, 136, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    /* 登录大标题 */
    .header-title h2 {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.8px;
      /* 标题微带青绿高光 */
      color: #ffffff;
    }

    /* 副标题副文本 */
    .header-title p {
      font-size: 13px;
      color: #80cbc4;
      margin-top: 5px;
      letter-spacing: 0.3px;
    }

    /* 表单项标签样式优化 */
    .el-form-item__label {
      color: #b2dfdb !important;
      font-size: 13px !important;
      font-weight: 500;
    }

    /* 深色青绿质感输入框与选择框 */
    .el-input__wrapper, .el-select__wrapper {
      background-color: rgba(5, 20, 19, 0.75) !important;
      box-shadow: 0 0 0 1px rgba(0, 150, 136, 0.25) inset !important;
      border-radius: 10px !important;
      transition: all 0.25s ease !important;
    }

    /* 聚焦状态下的绿蓝高亮光晕 */
    .el-input__wrapper.is-focus, .el-select__wrapper.is-focused {
      box-shadow: 0 0 0 1.5px #009688 inset, 0 0 10px rgba(0, 150, 136, 0.35) !important;
      background-color: rgba(6, 26, 25, 0.9) !important;
    }

    /* 输入文字色彩 */
    .el-input__inner, .el-select__selected-item {
      color: #ffffff !important;
    }

    /* 复选框文本 */
    .el-checkbox__label {
      color: #80cbc4 !important;
      font-size: 13px !important;
    }

    /* 复选框选中时的核心品牌色 #009688 */
    .el-checkbox__input.is-checked .el-checkbox__inner {
      background-color: #009688 !important;
      border-color: #009688 !important;
    }

    /* 绿蓝相间核心主提交按钮 (主色调 #009688 + 蓝绿渐变) */
    .submit-btn {
      width: 100%;
      height: 44px !important;
      border-radius: 10px !important;
      font-size: 14px !important;
      font-weight: 600 !important;
      letter-spacing: 0.5px;
      /* 绿蓝渐变：青绿 #009688 到湛蓝 #0284c7 */
      background: linear-gradient(135deg, #009688 0%, #00897b 45%, #0284c7 100%) !important;
      border: none !important;
      /* 按钮立体光晕阴影 */
      box-shadow: 0 6px 18px rgba(0, 150, 136, 0.4) !important;
      transition: all 0.25s ease !important;
    }

    /* 提交按钮悬停交互动态 */
    .submit-btn:hover {
      opacity: 0.95;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 150, 136, 0.6) !important;
    }

    /* 提交按钮按下触感 */
    .submit-btn:active {
      transform: translateY(0);
    }

    /* 次级透明描边按钮 */
    .secondary-btn {
      width: 100%;
      height: 40px !important;
      border-radius: 10px !important;
      font-size: 13px !important;
      margin-top: 10px !important;
      margin-left: 0 !important;
      background: rgba(0, 150, 136, 0.1) !important;
      border: 1px solid rgba(0, 150, 136, 0.35) !important;
      color: #80cbc4 !important;
      transition: all 0.2s ease !important;
    }

    /* 次级按钮悬停效果 */
    .secondary-btn:hover {
      background: rgba(0, 150, 136, 0.22) !important;
      color: #ffffff !important;
      border-color: #009688 !important;
    }

    /* 提示信息排版 */
    .alert-notice {
      margin-bottom: 18px;
      border-radius: 8px !important;
    }

    /* 已登录状态卡片精致化 */
    .logged-info-box {
      background: rgba(5, 24, 23, 0.65);
      border: 1px solid rgba(0, 150, 136, 0.3);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    /* 会话信息行 */
    .logged-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 13px;
    }

    /* 会话属性标题标签 */
    .logged-info-label {
      color: #80cbc4;
    }

    /* 会话属性高亮数值 */
    .logged-info-val {
      color: #48cae4;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- Vue 挂载根节点 -->
  <div id="app"></div>

  <!-- 组件模板块定义 -->
  <script type="text/x-template" id="login-template">
    <el-card class="login-card" :body-style="{ padding: '24px' }">
      <!-- 头部 LOGO 与标题 -->
      <div class="header-title">
        <div class="logo">
          <el-icon :size="26" color="#ffffff"><UserFilled /></el-icon>
        </div>
        <h2>DrawCode 云端接入</h2>
        <p>{{ stepTitle }}</p>
      </div>

      <!-- 反馈提示信息 -->
      <el-alert
        v-if="alertMessage"
        :title="alertMessage"
        :type="alertType"
        show-icon
        :closable="false"
        class="alert-notice"
      />

      <!-- 视图 1：已登录状态展示卡片 -->
      <div v-if="currentStep === 'logged'">
        <div class="logged-info-box">
          <div class="logged-info-row">
            <span class="logged-info-label">当前登录用户</span>
            <span class="logged-info-val">{{ sessionInfo.displayName }}</span>
          </div>
          <div class="logged-info-row" style="margin-bottom: 0;">
            <span class="logged-info-label">接入工作组</span>
            <span class="logged-info-val">{{ sessionInfo.groupName }} (ID: {{ sessionInfo.groupId }})</span>
          </div>
        </div>

        <el-button type="primary" class="submit-btn" @click="handleRelogin">
          切换账号重新登录
        </el-button>
        <el-button class="secondary-btn" @click="handleLogout">
          安全退出登录
        </el-button>
      </div>

      <!-- 视图 2：输入账号密码表单 -->
      <el-form
        v-else-if="currentStep === 'login'"
        ref="loginFormRef"
        :model="formData"
        :rules="formRules"
        label-position="top"
        @submit.prevent="handleLogin"
      >
        <el-form-item label="登录账号 / 手机号" prop="username">
          <el-input
            v-model="formData.username"
            placeholder="请输入手机号或账号"
            :prefix-icon="User"
            size="large"
            :disabled="loading"
          />
        </el-form-item>

        <el-form-item label="登录密码" prop="password">
          <el-input
            v-model="formData.password"
            type="password"
            placeholder="请输入登录密码"
            :prefix-icon="Lock"
            show-password
            size="large"
            :disabled="loading"
          />
        </el-form-item>

        <el-form-item>
          <el-checkbox v-model="formData.rememberMe" :disabled="loading">
            记住登录配置与工作组 (15天内免登)
          </el-checkbox>
        </el-form-item>

        <el-form-item>
          <el-button
            type="primary"
            class="submit-btn"
            :loading="loading"
            @click="handleLogin"
          >
            {{ loading ? '正在验证身份...' : '立即登录' }}
          </el-button>
        </el-form-item>
      </el-form>

      <!-- 视图 3：多工作组让用户手动选择 -->
      <div v-else-if="currentStep === 'selectGroup'">
        <div style="margin-bottom: 14px; font-size: 13px; color: #cbd5e1;">
          检测到账号拥有 <strong>{{ availableGroups.length }}</strong> 个工作组，请选择：
        </div>

        <el-form label-position="top">
          <el-form-item label="选择目标工作组">
            <el-select
              v-model="selectedGroupId"
              placeholder="请下拉选择工作组"
              size="large"
              style="width: 100%;"
              :disabled="loading"
            >
              <el-option
                v-for="g in availableGroups"
                :key="g.id"
                :label="g.groupName"
                :value="g.id"
              >
                <div style="display: flex; justify-content: space-between; align-items: center;">
                  <span>{{ g.groupName }}</span>
                  <span style="color: #94a3b8; font-size: 12px;">ID: {{ g.id }}</span>
                </div>
              </el-option>
            </el-select>
          </el-form-item>

          <el-form-item>
            <el-button
              type="primary"
              class="submit-btn"
              :loading="loading"
              @click="handleConfirmGroup"
            >
              {{ loading ? '正在接入中...' : '确认进入该工作组' }}
            </el-button>
            <el-button class="secondary-btn" :disabled="loading" @click="currentStep = 'login'">
              返回上一步
            </el-button>
          </el-form-item>
        </el-form>
      </div>
    </el-card>
  </script>

  <!-- Vue 3 Setup 逻辑 -->
  <script setup>
    const { ref, reactive, computed, onMounted } = Vue;
    const { User, Lock, UserFilled } = ElementPlusIconsVue;

    // 当前视图步骤：'logged' | 'login' | 'selectGroup'
    const currentStep = ref('login');
    const loginFormRef = ref(null);

    // 登录表单数据
    const formData = reactive({
      username: '',
      password: '',
      rememberMe: true
    });

    // 校验规则
    const formRules = reactive({
      username: [{ required: true, message: '请输入手机号或账号', trigger: 'blur' }],
      password: [{ required: true, message: '请输入登录密码', trigger: 'blur' }]
    });

    // 会话与工作组数据
    const sessionInfo = reactive({
      isLogged: false,
      displayName: '',
      groupName: '',
      groupId: 0
    });

    const pendingAuth = reactive({
      token: '',
      userId: '',
      displayName: '',
      userName: ''
    });

    const availableGroups = ref([]);
    const selectedGroupId = ref(null);

    // 交互状态
    const loading = ref(false);
    const alertMessage = ref('');
    const alertType = ref('error');

    // 步骤标题计算
    const stepTitle = computed(() => {
      if (currentStep.value === 'logged') return '当前会话已激活';
      if (currentStep.value === 'selectGroup') return '选择接入工作组';
      return '账户身份认证与工作组接入';
    });

    // 注册 WebView2 消息监听
    onMounted(() => {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.addEventListener('message', (event) => {
          const res = event.data;
          loading.value = false;

          // 处理会话初始化结果
          if (res.action === 'sessionInfo') {
            const data = res.data;
            if (data && data.IsLogged && data.GroupId > 0) {
              sessionInfo.isLogged = true;
              sessionInfo.displayName = data.DisplayName;
              sessionInfo.groupName = data.GroupName;
              sessionInfo.groupId = data.GroupId;
              currentStep.value = 'logged';
            } else {
              currentStep.value = 'login';
            }
          }
          // 处理登录返回
          else if (res.action === 'loginResult') {
            if (res.Success) {
              if (res.NeedSelectGroup) {
                // 多工作组：让用户选择
                pendingAuth.token = res.Token;
                pendingAuth.userId = res.UserId;
                pendingAuth.displayName = res.DisplayName;
                pendingAuth.userName = formData.username;
                availableGroups.value = res.Groups || [];
                selectedGroupId.value = res.Groups && res.Groups.length > 0 ? res.Groups[0].id : null;
                alertType.value = 'success';
                alertMessage.value = res.Message;
                currentStep.value = 'selectGroup';
              } else {
                // 单工作组：自动进入成功
                alertType.value = 'success';
                alertMessage.value = res.Message || '登录成功，正在进入系统...';
              }
            } else {
              alertType.value = 'error';
              alertMessage.value = res.Message || '登录失败，请检查账号密码！';
            }
          }
          // 处理选择工作组返回
          else if (res.action === 'selectGroupResult') {
            if (res.Success) {
              alertType.value = 'success';
              alertMessage.value = res.Message || '工作组接入成功！';
            } else {
              alertType.value = 'error';
              alertMessage.value = res.Message || '工作组接入失败！';
            }
          }
          // 处理注销
          else if (res.action === 'logoutResult') {
            sessionInfo.isLogged = false;
            currentStep.value = 'login';
            alertType.value = 'success';
            alertMessage.value = '已成功退出登录！';
          }
          // 兜底异常
          else if (res.action === 'error') {
            alertType.value = 'error';
            alertMessage.value = res.Message || '发生未知异常！';
          }
        });

        // 页面就绪后主动查询当前会话
        window.chrome.webview.postMessage({ action: 'getSession' });
      }
    });

    // 登录按钮事件
    const handleLogin = () => {
      if (!loginFormRef.value) return;
      loginFormRef.value.validate((valid) => {
        if (!valid) return;
        alertMessage.value = '';
        loading.value = true;
        const payload = {
          action: 'login',
          username: formData.username,
          password: formData.password,
          rememberMe: formData.rememberMe
        };
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage(payload);
        }
      });
    };

    // 确认选择工作组
    const handleConfirmGroup = () => {
      if (!selectedGroupId.value) {
        alertType.value = 'warning';
        alertMessage.value = '请先选择一个工作组！';
        return;
      }
      const group = availableGroups.value.find(g => g.id === selectedGroupId.value);
      alertMessage.value = '';
      loading.value = true;
      const payload = {
        action: 'selectGroup',
        token: pendingAuth.token,
        userId: pendingAuth.userId,
        userName: pendingAuth.userName,
        displayName: pendingAuth.displayName,
        groupId: selectedGroupId.value,
        groupName: group ? group.groupName : '',
        rememberMe: formData.rememberMe
      };
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(payload);
      }
    };

    // 重新登录
    const handleRelogin = () => {
      currentStep.value = 'login';
      alertMessage.value = '';
    };

    // 注销
    const handleLogout = () => {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ action: 'logout' });
      }
    };
  </script>

  <!-- 浏览器解析绑定 setup 逻辑与 Element Plus -->
  <script>
    (function() {
      const templateText = document.getElementById('login-template').innerHTML;
      const setupScriptText = document.querySelector('script[setup]').textContent;

      const Component = {
        template: templateText,
        components: { UserFilled: ElementPlusIconsVue.UserFilled },
        setup() {
          const setupFunc = new Function('Vue', 'ElementPlusIconsVue', `
            ${setupScriptText}
            return {
              currentStep, loginFormRef, formData, formRules, sessionInfo,
              availableGroups, selectedGroupId, loading, alertMessage, alertType,
              stepTitle, handleLogin, handleConfirmGroup, handleRelogin, handleLogout,
              User, Lock, UserFilled
            };
          `);
          return setupFunc(Vue, ElementPlusIconsVue);
        }
      };

      const app = Vue.createApp(Component);
      app.use(ElementPlus);
      app.mount('#app');
    })();
  </script>
</body>
</html>
