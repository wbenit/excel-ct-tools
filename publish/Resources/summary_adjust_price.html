<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>汇总调价</title>
  <!-- 引入 Element Plus 样式库 -->
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <!-- 引入 Vue 3 核心库 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- 引入 Element Plus 组件库 -->
  <script src="https://unpkg.com/element-plus"></script>
  <!-- 引入 Element Plus 图标库 -->
  <script src="https://unpkg.com/@element-plus/icons-vue"></script>
  <!-- 引入公共绿蓝相间主题样式 (主色调 #009688) -->
  <link rel="stylesheet" href="theme.css">
  <style>
    /* 全局基础重置与无滚动条设定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
      user-select: none;
      background-color: #ffffff;
      color: #333333;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      border: 1px solid #dcdfe6;
      background-color: #ffffff;
    }

    /* ================= 图一：初始选择与配置视图样式 ================= */

    /* 顶部无边框窗体拖拽标题栏 (绿蓝相间风格) */
    .window-header {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px 0 12px;
      background: linear-gradient(135deg, #009688, #00796b);
      color: #ffffff;
      cursor: move;
      touch-action: none; /* 禁用系统手势干扰，保障平滑拖拽 */
    }

    .window-title-box {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .window-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .action-btn {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 3px;
      color: #ffffff;
      opacity: 0.85;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      opacity: 1;
      background-color: rgba(255, 255, 255, 0.2);
    }

    .action-btn.close-btn:hover {
      background-color: #ef4444;
      color: #ffffff;
    }

    /* 顶部引导与操作区 */
    .top-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 10px 20px;
    }

    .banner-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .banner-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--theme-main);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--theme-main);
      font-size: 22px;
      background-color: var(--theme-main-light);
    }

    .banner-text-title {
      font-size: 16px;
      font-weight: 600;
      color: #303133;
      margin-bottom: 3px;
    }

    .banner-text-sub {
      font-size: 12px;
      color: #606266;
    }

    /* 立即生成主按钮 */
    .generate-btn {
      background: linear-gradient(135deg, #009688 0%, #00796b 100%) !important;
      border-color: #00796b !important;
      color: #ffffff !important;
      font-size: 15px !important;
      font-weight: bold !important;
      padding: 10px 28px !important;
      height: 42px !important;
      border-radius: 6px !important;
      letter-spacing: 1px !important;
      box-shadow: 0 2px 8px rgba(0, 150, 136, 0.35);
      transition: all 0.2s ease;
    }

    .generate-btn:hover {
      background: linear-gradient(135deg, #26a69a 0%, #00897b 100%) !important;
      border-color: #00897b !important;
      box-shadow: 0 4px 12px rgba(0, 150, 136, 0.45);
      transform: translateY(-1px);
    }

    .generate-btn:active {
      transform: translateY(0);
    }

    /* 中部分类列表区 */
    .content-area {
      flex: 1;
      padding: 6px 20px 10px 20px;
      overflow-y: auto;
      border-top: 1px solid #f0f0f0;
    }

    /* 自定义滚动条 */
    .content-area::-webkit-scrollbar {
      width: 6px;
    }

    .content-area::-webkit-scrollbar-thumb {
      background: #b2dfdb;
      border-radius: 3px;
    }

    .content-area::-webkit-scrollbar-thumb:hover {
      background: #80cbc4;
    }

    .category-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 4px;
    }

    .category-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }

    .category-item:hover {
      background-color: #f0fdfa;
      border-color: #ccfbf1;
    }

    .category-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category-name {
      font-size: 13px;
      color: #303133;
      font-weight: 500;
    }

    .category-count {
      font-size: 12px;
      color: #00796b;
      background-color: #e0f2f1;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 600;
    }

    .empty-tip {
      text-align: center;
      padding: 40px 0;
      color: #909399;
      font-size: 13px;
    }

    /* 底部配置栏 */
    .bottom-panel {
      border-top: 1px solid #e0f2f1;
      padding: 12px 20px;
      background-color: #f7faf9;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .select-all-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .custom-summary-link {
      font-size: 12px;
      color: var(--theme-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }

    .custom-summary-link:hover {
      text-decoration: underline;
    }

    .config-row {
      display: flex;
      align-items: center;
      font-size: 12px;
      color: #303133;
      gap: 8px;
      flex-wrap: wrap;
    }

    .config-label {
      font-weight: 600;
      color: #00796b;
      white-space: nowrap;
      min-width: 62px;
    }

    .config-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .el-checkbox,
    .el-radio {
      margin-right: 10px !important;
      font-size: 12px !important;
      height: 22px !important;
    }

    .el-checkbox__label,
    .el-radio__label {
      font-size: 12px !important;
      padding-left: 5px !important;
    }

    /* 覆盖勾选框主色调 #009688 */
    .theme-checkbox .el-checkbox__input.is-checked .el-checkbox__inner,
    .theme-checkbox .el-checkbox__input.is-indeterminate .el-checkbox__inner {
      background-color: var(--theme-main) !important;
      border-color: var(--theme-main) !important;
    }

    .theme-checkbox .el-checkbox__input.is-checked+.el-checkbox__label {
      color: #00796b !important;
    }

    .theme-radio .el-radio__input.is-checked .el-radio__inner {
      border-color: var(--theme-main) !important;
      background-color: var(--theme-main) !important;
    }

    .theme-radio .el-radio__input.is-checked+.el-radio__label {
      color: #00796b !important;
    }

    .link-setting {
      color: var(--theme-main);
      cursor: pointer;
      margin-left: 2px;
      font-weight: 500;
    }

    .link-setting:hover {
      text-decoration: underline;
    }

    /* ================= 图二：生成后紧凑编辑条视图样式 (高保真还原) ================= */

    .editor-mode-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background-color: #ffffff;
    }

    /* 图二顶部浅色居中标题栏 */
    .editor-header {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #ffffff;
      color: #333333;
      cursor: move;
      touch-action: none; /* 禁用系统手势干扰，保障平滑拖拽 */
    }

    .editor-title {
      font-size: 13px;
      font-weight: 500;
      color: #333333;
      letter-spacing: 0.5px;
    }

    .editor-close-btn {
      position: absolute;
      right: 8px;
      top: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      color: #909399;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .editor-close-btn:hover {
      color: #f56c6c;
      background-color: #fef0f0;
      border-radius: 2px;
    }

    /* 图二中间绿蓝横向渐变分割线 (主色调 #009688) */
    .editor-divider-line {
      height: 2px;
      width: 96%;
      margin: 0 auto;
      background: radial-gradient(ellipse at center, rgba(0, 150, 136, 0.85) 0%, rgba(0, 150, 136, 0.45) 45%, rgba(0, 150, 136, 0) 88%);
    }

    /* 图二主体内容行 */
    .editor-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px 4px 16px;
    }

    .editor-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 图二左侧绿蓝圆形编辑图标 (主色调 #009688) */
    .editor-icon-box {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--theme-main);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--theme-main);
      background-color: var(--theme-main-light);
      flex-shrink: 0;
    }

    .editor-text-group {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }

    .editor-main-title {
      font-size: 14px;
      font-weight: bold;
      color: #333333;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .editor-sub-tip {
      font-size: 12px;
      color: #0288d1;
      /* 提示浅蓝色 */
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    /* 中间复选框控制区域 */
    .editor-checkbox-group {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 8px;
    }

    .editor-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* 重新汇总操作链接 (主色调 #009688) */
    .re-summary-link {
      font-size: 13px;
      color: var(--theme-main);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    .re-summary-link:hover {
      color: var(--theme-main-hover);
      text-decoration: underline;
      opacity: 0.9;
    }

    /* 一键更新绿蓝胶囊主按钮 (主色调 #009688) */
    .quick-update-btn {
      background: linear-gradient(135deg, #009688 0%, #00796b 100%) !important;
      border-color: #00796b !important;
      color: #ffffff !important;
      font-size: 14px !important;
      font-weight: bold !important;
      height: 36px !important;
      padding: 0 18px !important;
      border-radius: 6px !important;
      box-shadow: 0 2px 6px rgba(0, 150, 136, 0.35);
      transition: all 0.2s ease;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .quick-update-btn:hover {
      background: linear-gradient(135deg, #26a69a 0%, #00897b 100%) !important;
      border-color: #00897b !important;
      box-shadow: 0 4px 10px rgba(0, 150, 136, 0.45);
      transform: translateY(-1px);
    }

    .quick-update-btn:active {
      transform: translateY(0);
    }

    /* 重新配置小返回按钮 */
    .reconfig-icon-btn {
      cursor: pointer;
      color: #909399;
      font-size: 14px;
      display: flex;
      align-items: center;
      padding: 4px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .reconfig-icon-btn:hover {
      color: var(--theme-main);
      background-color: #f0fdfa;
    }
  </style>
</head>

<body>
  <div id="app">

    <!-- ================= 视图 1：图一 分类选择与生成配置面板 ================= -->
    <template v-if="currentView === 'config'">
      <!-- 顶部标题栏，支持鼠标拖拽与控制 (采用 PointerEvents 平滑位移) -->
      <div class="window-header" @pointerdown="handleHeaderPointerDown">
        <div class="window-title-box">
          <el-icon :size="15">
            <Tickets />
          </el-icon>
          <span>汇总调价</span>
        </div>
        <div class="window-actions">
          <!-- 最小化按钮 -->
          <div class="action-btn" title="最小化" @mousedown.stop @click.stop="minimizeWindow">
            <el-icon :size="14">
              <Minus />
            </el-icon>
          </div>
          <!-- 刷新按钮 -->
          <div class="action-btn" title="刷新工作表列表" @mousedown.stop @click.stop="refreshData">
            <el-icon :size="14">
              <Refresh />
            </el-icon>
          </div>
          <!-- 关闭按钮 -->
          <div class="action-btn close-btn" title="关闭窗口" @mousedown.stop @click.stop="closeWindow">
            <el-icon :size="14">
              <Close />
            </el-icon>
          </div>
        </div>
      </div>

      <!-- 顶部引导与操作区 -->
      <div class="top-banner">
        <div class="banner-left">
          <div class="banner-icon">
            <el-icon>
              <Tickets />
            </el-icon>
          </div>
          <div>
            <div class="banner-text-title">选择分类生成元件汇总表</div>
            <div class="banner-text-sub">请选择要汇总的分类:</div>
          </div>
        </div>
        <!-- 立即生成按钮 (显式闭合标签) -->
        <el-button class="generate-btn" :loading="generating" @click="handleGenerate">
          立即生成
        </el-button>
      </div>

      <!-- 中部分类工作表列表区 -->
      <div class="content-area">
        <div v-if="categories.length > 0" class="category-list">
          <div v-for="item in categories" :key="item.sheetName" class="category-item">
            <div class="category-item-left">
              <!-- 分类勾选框 (使用显式闭合标签) -->
              <el-checkbox class="theme-checkbox" v-model="item.isSelected" @change="handleItemCheckChange">
                <span class="category-name">{{ item.sheetName }}</span>
              </el-checkbox>
            </div>
            <!-- 右侧台数展示 -->
            <span class="category-count">{{ item.cabinetCount }}台</span>
          </div>
        </div>
        <div v-else class="empty-tip">
          <span v-if="loading">正在读取工作簿分类与箱柜数据...</span>
          <span v-else>未在当前工作簿中检测到分类工作表</span>
        </div>
      </div>

      <!-- 底部配置控制栏 -->
      <div class="bottom-panel">
        <!-- 全选与自定义汇总行 -->
        <div class="select-all-row">
          <!-- 全选复选框 (显式闭合) -->
          <el-checkbox class="theme-checkbox" v-model="isAllSelected" :indeterminate="isIndeterminate"
            @change="handleSelectAllChange">
            <span style="font-weight: 500;">全选</span>
          </el-checkbox>
          <span class="custom-summary-link" @click="toggleCustomSummary">
            <span>▼ 自定义汇总</span>
          </span>
        </div>

        <!-- 合并条件 -->
        <div class="config-row">
          <span class="config-label">合并条件:</span>
            <!-- 合并条件：名称 (支持自由勾选与取消) -->
            <el-checkbox class="theme-checkbox" v-model="mergeOpts.byName">名称</el-checkbox>
            <span style="color: #909399;">+</span>
            <!-- 固定必选项：型号 -->
            <el-checkbox class="theme-checkbox" v-model="mergeOpts.byModel" disabled>型号</el-checkbox>
            <span style="color: #909399;">+</span>
            <!-- 厂家 -->
            <el-checkbox class="theme-checkbox" v-model="mergeOpts.byManufacturer">
              厂家 (
            </el-checkbox>
            <!-- 无厂家选项 -->
            <el-checkbox class="theme-checkbox" v-model="mergeOpts.includeNoManufacturer"
              style="margin-left: -5px; margin-right: 2px !important;">无厂家</el-checkbox>
            <span style="margin-right: 5px;">) +</span>
            <!-- 价格 -->
            <el-checkbox class="theme-checkbox" v-model="mergeOpts.byPrice">价格</el-checkbox>
            <span style="color: #909399;">+</span>
            <!-- 备注 -->
            <el-checkbox class="theme-checkbox" v-model="mergeOpts.byRemark">备注</el-checkbox>
            <span style="color: #909399;">+</span>
            <!-- 原图型号 -->
            <el-checkbox class="theme-checkbox" v-model="mergeOpts.byOriginalModel">原图型号</el-checkbox>
            <span style="font-size: 12px; color: #606266; margin-left: 2px;">相同合并</span>
          </div>
        </div>

        <!-- 显示设置 -->
        <div class="config-row">
          <span class="config-label">显示设置:</span>
          <div class="config-group">
            <el-checkbox class="theme-checkbox" v-model="displayOpts.splitAccessoryAndDiscount">附件表价、折扣分列</el-checkbox>
            <el-checkbox class="theme-checkbox" v-model="displayOpts.freezeUnitPrice">冻结单价列</el-checkbox>
          </div>
        </div>

        <!-- 排序设置 -->
        <div class="config-row" style="align-items: flex-start;">
          <span class="config-label" style="margin-top: 2px;">排序设置:</span>
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <!-- 单选选项1: 按厂家、名称、型号 -->
            <el-radio class="theme-radio" v-model="sortType" label="mfg_name_model">
              按(厂家、名称、型号) 排序
            </el-radio>

            <!-- 单选选项2: 按类别+位置、名称、厂家、型号 -->
            <div style="display: flex; align-items: center;">
              <el-radio class="theme-radio" v-model="sortType" label="category_pos_mfg"
                style="margin-right: 0px !important;">
                按(
              </el-radio>
              <el-checkbox class="theme-checkbox" v-model="sortOpts.byCategory" style="margin-right: 4px !important;">
                类别
              </el-checkbox>
              <span style="color: #909399; margin-right: 4px;">+</span>
              <el-checkbox class="theme-checkbox" v-model="sortOpts.byPosition" style="margin-right: 4px !important;">
                位置、名称、厂家、型号
              </el-checkbox>
              <span>) 排序</span>
            </div>

            <!-- 单选选项3: 自定义排序 -->
            <div style="display: flex; align-items: center;">
              <el-radio class="theme-radio" v-model="sortType" label="custom">
                自定义排序
              </el-radio>
              <span class="link-setting" @click="handleCustomSortSetting">(设置)</span>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ================= 视图 2：图二 紧凑编辑条 (高保真还原) ================= -->
    <template v-else-if="currentView === 'editor'">
      <div class="editor-mode-container">
        <!-- 顶部浅色拖拽标题栏 (采用 PointerEvents 平滑位移) -->
        <div class="editor-header" @pointerdown="handleHeaderPointerDown">
          <div class="editor-title">汇总调价</div>
          <!-- 右上角关闭按钮 -->
          <div class="editor-close-btn" title="关闭窗口" @mousedown.stop @click.stop="closeWindow">
            <el-icon>
              <Close />
            </el-icon>
          </div>
        </div>

        <!-- 中间红棕色微光渐变横线 -->
        <div class="editor-divider-line"></div>

        <!-- 主体操作内容行 -->
        <div class="editor-body">
          <!-- 左侧图标与提示文字 -->
          <div class="editor-left">
            <div class="editor-icon-box">
              <!-- 精美编辑写字板图标 SVG -->
              <svg viewBox="0 0 1024 1024" width="22" height="22" fill="currentColor">
                <path
                  d="M832 512v320H192V192h320V128H192c-35.3 0-64 28.7-64 64v640c0 35.3 28.7 64 64 64h640c35.3 0 64-28.7 64-64V512h-64z" />
                <path
                  d="M885.3 138.7c-25-25-65.5-25-90.5 0L426.7 506.8l-37.4 127.9 127.9-37.4 368.1-368.1c25-25 25-65.5 0-90.5zM484.5 565.3l25.8-25.8 45.3 45.3-25.8 25.8-45.3-45.3zm290.7-290.7l-45.3-45.3 45.3-45.3 45.3 45.3-45.3 45.3z" />
              </svg>
            </div>
            <div class="editor-text-group">
              <div class="editor-main-title">编辑元件[下表中]</div>
              <div class="editor-sub-tip">↓仅可编辑[白色]列数据...</div>
            </div>
          </div>

          <!-- 中间复选框控制区：控制价格列隐藏 -->
          <div class="editor-checkbox-group">
            <!-- 隐藏价格列(G~O) 复选框 (显式闭合标签) -->
            <el-checkbox class="theme-checkbox" v-model="hidePriceColumns" @change="handleTogglePriceColumns">
              隐藏价格列(G~O)
            </el-checkbox>
          </div>

          <!-- 右侧操作区：重新配置、重新汇总与一键更新 -->
          <div class="editor-right">
            <!-- 返回重新配置选项 -->
            <div class="reconfig-icon-btn" title="修改汇总配置" @click="switchToConfigView">
              <el-icon :size="16">
                <Setting />
              </el-icon>
            </div>

            <!-- 重新汇总链接按钮 -->
            <div class="re-summary-link" title="按当前配置重新提取各分类元件生成汇总表" @click="handleReGenerate">
              <el-icon v-if="reGenerating" class="is-loading" style="margin-right: 2px;">
                <Loading />
              </el-icon>
              <span>重新汇总</span>
            </div>

            <!-- 一键更新绿蓝主题主按钮 (显式闭合标签) -->
            <el-button class="quick-update-btn" :loading="updating" @click="handleQuickUpdate">
              一键更新
            </el-button>
          </div>
        </div>
      </div>
    </template>

  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;
    const { ElMessage } = ElementPlus;

    const app = createApp({
      setup() {
        // 当前视图模式: 'config' 为图一配置面板，'editor' 为图二紧凑编辑条
        const currentView = ref('config');

        // 状态定义: 分类列表与加载状态
        const categories = ref([]);
        const loading = ref(false);
        const generating = ref(false);
        const reGenerating = ref(false);
        const updating = ref(false);

        // 缓存上一次成功生成的完整配置参数
        const lastSummaryConfig = ref(null);

        // 列隐藏控制状态 (仅保留价格列 F~P 隐藏控制)
        const hidePriceColumns = ref(false);

        // 合并条件配置
        const mergeOpts = ref({
          byName: true,
          byModel: true,
          byManufacturer: true,
          includeNoManufacturer: false,
          byPrice: false,
          byRemark: false,
          byOriginalModel: false
        });

        // 显示设置配置
        const displayOpts = ref({
          splitAccessoryAndDiscount: true,
          freezeUnitPrice: false
        });

        // 排序规则选择
        const sortType = ref('mfg_name_model');
        const sortOpts = ref({
          byCategory: false,
          byPosition: true
        });

        // 计算属性: 全选与半选状态计算
        const isAllSelected = computed({
          get: () => {
            if (categories.value.length === 0) return false;
            return categories.value.every(item => item.isSelected);
          },
          set: (val) => {
            categories.value.forEach(item => item.isSelected = val);
          }
        });

        const isIndeterminate = computed(() => {
          const selectedCount = categories.value.filter(item => item.isSelected).length;
          return selectedCount > 0 && selectedCount < categories.value.length;
        });

        // 全选复选框切换处理
        const handleSelectAllChange = (val) => {
          categories.value.forEach(item => item.isSelected = val);
        };

        // 单项勾选改变处理
        const handleItemCheckChange = () => {
          // 触发计算属性更新
        };

        // 窗口无模态平滑拖拽处理 (基于 PointerEvents + rAF 节流，彻底杜绝 Win32 模态循环死锁与 Excel 崩溃)
        const handleHeaderPointerDown = (e) => {
          // 仅响应鼠标主键 (button === 0)
          if (e.button !== 0) return;
          // 排除点击在控制按钮和链接上的情况
          if (e.target.closest('.action-btn') || e.target.closest('.editor-close-btn') || e.target.closest('.re-summary-link') || e.target.closest('.quick-update-btn') || e.target.closest('.reconfig-icon-btn') || e.target.closest('.el-checkbox')) return;

          // 获取物理像素与 CSS 像素缩放比率 (保障高分屏精准 1:1 跟随)
          const dpi = window.devicePixelRatio || 1;
          let lastScreenX = e.screenX;
          let lastScreenY = e.screenY;
          let pendingDeltaX = 0;
          let pendingDeltaY = 0;
          let rafId = null;

          try {
            e.target.setPointerCapture(e.pointerId);
          } catch (_) {}

          const onPointerMove = (moveEvt) => {
            pendingDeltaX += (moveEvt.screenX - lastScreenX) * dpi;
            pendingDeltaY += (moveEvt.screenY - lastScreenY) * dpi;
            lastScreenX = moveEvt.screenX;
            lastScreenY = moveEvt.screenY;

            if (!rafId) {
              rafId = requestAnimationFrame(() => {
                const dx = Math.round(pendingDeltaX);
                const dy = Math.round(pendingDeltaY);
                if (dx !== 0 || dy !== 0) {
                  if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(JSON.stringify({ action: 'moveWindow', deltaX: dx, deltaY: dy }));
                  }
                  pendingDeltaX = 0;
                  pendingDeltaY = 0;
                }
                rafId = null;
              });
            }
          };

          const onPointerUp = () => {
            try {
              e.target.releasePointerCapture(e.pointerId);
            } catch (_) {}
            if (rafId) {
              cancelAnimationFrame(rafId);
              rafId = null;
            }
            const dx = Math.round(pendingDeltaX);
            const dy = Math.round(pendingDeltaY);
            if (dx !== 0 || dy !== 0) {
              if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(JSON.stringify({ action: 'moveWindow', deltaX: dx, deltaY: dy }));
              }
              pendingDeltaX = 0;
              pendingDeltaY = 0;
            }
            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);
            window.removeEventListener('pointercancel', onPointerUp);
          };

          window.addEventListener('pointermove', onPointerMove);
          window.addEventListener('pointerup', onPointerUp);
          window.addEventListener('pointercancel', onPointerUp);
        };

        // 兼容旧版调用别名
        const handleHeaderMouseDown = handleHeaderPointerDown;

        // 最小化窗口
        const minimizeWindow = () => {
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(JSON.stringify({ action: 'minimize' }));
          }
        };

        // 关闭窗口
        const closeWindow = () => {
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(JSON.stringify({ action: 'close' }));
          }
        };

        // 调整窗口尺寸向宿主 C# 发送指令
        const sendResizeWindow = (w, h) => {
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(JSON.stringify({
              action: 'resizeWindow',
              width: w,
              height: h
            }));
          }
        };

        // 切换回图一配置面板
        const switchToConfigView = () => {
          currentView.value = 'config';
          // 恢复 720x620 尺寸
          sendResizeWindow(720, 620);
        };

        // 切换为图二紧凑编辑条
        const switchToEditorView = () => {
          currentView.value = 'editor';
          // 切换为 690x115 紧凑悬浮尺寸（自适应容纳复选框）
          sendResizeWindow(690, 115);
          // 探测当前表格的列隐藏状态
          fetchColumnsHiddenStatus();
        };

        // 切换价格列 (G~O) 隐藏状态
        const handleTogglePriceColumns = (val) => {
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(JSON.stringify({
              action: 'toggleColumnsVisibility',
              targetRange: 'G:O',
              hidden: val
            }));
          }
        };

        // 主动向 C# 获取当前活动工作表的列隐藏状态
        const fetchColumnsHiddenStatus = () => {
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(JSON.stringify({
              action: 'getColumnsHiddenStatus'
            }));
          }
        };

        // 自定义汇总点击
        const toggleCustomSummary = () => {
          ElMessage.info('当前已展示全部汇总条件');
        };

        // 自定义排序设置点击
        const handleCustomSortSetting = () => {
          ElMessage.info('可在生成后根据各列标题自由排序');
        };

        // 向后端获取分类工作表与箱柜统计数据
        const refreshData = () => {
          loading.value = true;
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(JSON.stringify({
              action: 'getCategories'
            }));
          } else {
            // 浏览器本地测试模拟数据
            setTimeout(() => {
              categories.value = [
                { sheetName: '分类1', cabinetCount: 24, isSelected: true },
                { sheetName: '高压配电室', cabinetCount: 29, isSelected: true },
                { sheetName: '低压配电室', cabinetCount: 13, isSelected: true }
              ];
              loading.value = false;
            }, 300);
          }
        };

        // 点击“立即生成”按钮响应
        const handleGenerate = () => {
          const selectedSheets = categories.value.filter(item => item.isSelected).map(item => item.sheetName);
          if (selectedSheets.length === 0) {
            ElMessage.warning('请至少选择一个要汇总的分类工作表！');
            return;
          }

          generating.value = true;
          const payload = {
            action: 'generateSummary',
            selectedSheets: selectedSheets,
            mergeConditions: {
              byName: mergeOpts.value.byName,
              byModel: mergeOpts.value.byModel,
              byManufacturer: mergeOpts.value.byManufacturer,
              includeNoManufacturer: mergeOpts.value.includeNoManufacturer,
              byPrice: mergeOpts.value.byPrice,
              byRemark: mergeOpts.value.byRemark,
              byOriginalModel: mergeOpts.value.byOriginalModel
            },
            displaySettings: {
              splitAccessoryAndDiscount: displayOpts.value.splitAccessoryAndDiscount,
              freezeUnitPrice: displayOpts.value.freezeUnitPrice
            },
            sortSettings: {
              sortType: sortType.value,
              byCategory: sortOpts.value.byCategory,
              byPosition: sortOpts.value.byPosition
            }
          };

          // 缓存本次配置
          lastSummaryConfig.value = JSON.parse(JSON.stringify(payload));

          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(JSON.stringify(payload));
          } else {
            // 离线模拟
            setTimeout(() => {
              generating.value = false;
              switchToEditorView();
              ElMessage.success('元件汇总表生成成功！');
            }, 800);
          }
        };

        // 图二：点击“重新汇总”（按开始配置重新生成）
        const handleReGenerate = () => {
          if (reGenerating.value) return;

          // 检查是否有缓存配置
          if (!lastSummaryConfig.value) {
            // 回退使用当前配置
            handleGenerate();
            return;
          }

          reGenerating.value = true;
          const payload = {
            ...lastSummaryConfig.value,
            action: 'generateSummary'
          };

          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(JSON.stringify(payload));
          } else {
            setTimeout(() => {
              reGenerating.value = false;
              ElMessage.success('已按开始配置重新生成元件汇总表！');
            }, 600);
          }
        };

        // 图二：点击“一键更新”（先预留功能）
        const handleQuickUpdate = () => {
          if (updating.value) return;
          updating.value = true;

          const payload = {
            action: 'updateFromSummary'
          };

          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(JSON.stringify(payload));
          } else {
            setTimeout(() => {
              updating.value = false;
              ElMessage.info('一键更新功能已准备就绪 (当前预留)');
            }, 400);
          }
        };

        // 监听 C# WebView2 发送过来的消息
        onMounted(() => {
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', (event) => {
              try {
                const response = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;

                // 1. 分类数据返回
                if (response.action === 'onCategoriesLoaded') {
                  loading.value = false;
                  if (response.success && response.data) {
                    categories.value = response.data.map(item => ({
                      sheetName: item.sheetName || item.SheetName || '',
                      cabinetCount: item.cabinetCount !== undefined ? item.cabinetCount : (item.CabinetCount !== undefined ? item.CabinetCount : 0),
                      isSelected: item.isSelected !== undefined ? item.isSelected : (item.IsSelected !== undefined ? item.IsSelected : true)
                    }));
                  } else {
                    ElMessage.error(response.message || '获取分类列表失败');
                  }
                }
                // 2. 汇总生成结果返回
                else if (response.action === 'onSummaryGenerated') {
                  generating.value = false;
                  reGenerating.value = false;
                  if (response.success) {
                    ElMessage.success(response.message || '元件汇总表生成成功！');
                    // 生成成功后切换至图二紧凑编辑条视图
                    switchToEditorView();
                  } else {
                    ElMessage.error(response.message || '汇总表生成失败');
                  }
                }
                // 3. 一键更新结果返回
                else if (response.action === 'onSummaryUpdated') {
                  updating.value = false;
                  if (response.success) {
                    ElMessage.success(response.message || '一键更新成功！');
                  } else {
                    ElMessage.warning(response.message || '一键更新操作未完成');
                  }
                }
                // 4. 列隐藏状态加载返回
                else if (response.action === 'onColumnsHiddenStatusLoaded') {
                  if (response.success && response.data) {
                    hidePriceColumns.value = !!response.data.hidePriceColumns;
                  }
                }
                // 5. 列隐藏操作结果返回
                else if (response.action === 'onColumnsVisibilityChanged') {
                  if (!response.success) {
                    ElMessage.warning(response.message || '设置列显示状态失败');
                  }
                }
              } catch (err) {
                console.error('解析后端消息异常:', err);
              }
            });
          }

          // 初始化读取分类（立即触发 + 延时触发确保 WebView2 桥接稳固）
          refreshData();
          setTimeout(() => {
            if (categories.value.length === 0) {
              refreshData();
            }
          }, 150);
        });

        return {
          currentView,
          categories,
          loading,
          generating,
          reGenerating,
          updating,
          hidePriceColumns,
          mergeOpts,
          displayOpts,
          sortType,
          sortOpts,
          isAllSelected,
          isIndeterminate,
          handleSelectAllChange,
          handleItemCheckChange,
          handleHeaderPointerDown,
          handleHeaderMouseDown,
          minimizeWindow,
          closeWindow,
          switchToConfigView,
          switchToEditorView,
          handleTogglePriceColumns,
          fetchColumnsHiddenStatus,
          refreshData,
          handleGenerate,
          handleReGenerate,
          handleQuickUpdate,
          toggleCustomSummary,
          handleCustomSortSetting
        };
      }
    });

    // 注册所有 Element Plus 图标
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
      app.component(key, component);
    }

    app.use(ElementPlus);
    app.mount('#app');
  </script>
</body>

</html>
