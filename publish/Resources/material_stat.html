<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>材料统计 - 导出采购清单</title>
  <!-- 引入 Element Plus 样式库 -->
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <!-- 引入 Font Awesome 图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- 引入 Vue 3 核心库 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- 引入 Element Plus 组件库 -->
  <script src="https://unpkg.com/element-plus"></script>
  <!-- 引入公共主题样式 (主色调 #009688) -->
  <link rel="stylesheet" href="theme.css">
  <style>
    /* 全局重置与防溢出 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
      user-select: none;
      background-color: #f8fafc;
      color: #334155;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
      overflow: hidden;
    }

    /* 顶部无边框拖拽标题栏 (绿蓝相间主题, 主色调 #009688) */
    .window-header {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: linear-gradient(135deg, #009688 0%, #00796b 100%);
      color: #ffffff;
      cursor: move;
      flex-shrink: 0;
      touch-action: none;
      box-shadow: 0 2px 4px rgba(0, 150, 136, 0.15);
    }

    .window-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .close-btn {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      opacity: 0.85;
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      opacity: 1;
      background-color: rgba(239, 68, 68, 0.9);
      color: #ffffff;
    }

    /* 主体内容容器 */
    .main-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 16px 10px 16px;
      overflow: hidden;
      min-height: 0;
      gap: 10px;
    }

    /* 提示横幅卡片 */
    .banner-tip {
      background: linear-gradient(135deg, #e6fffa 0%, #e0f2fe 100%);
      border: 1px solid #b2f5ea;
      border-radius: 6px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .tip-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: #00796b;
      font-weight: 500;
    }

    .tip-badge {
      background-color: #009688;
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .exist-badge {
      background-color: #fff7ed;
      color: #ea580c;
      border: 1px solid #fed7aa;
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-right: 6px;
    }

    /* 排序设置卡片 */
    .sort-card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .sort-left {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
    }

    .sort-left i {
      color: #009688;
    }

    .default-pill {
      font-size: 10px;
      background-color: #009688;
      color: #ffffff;
      padding: 1px 5px;
      border-radius: 4px;
      margin-left: 3px;
      font-weight: 500;
    }

    /* 工具按钮条 */
    .toolbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .tool-btns {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-link-btn {
      font-size: 12px;
      color: #009688;
      cursor: pointer;
      background: none;
      border: none;
      padding: 2px 6px;
      border-radius: 3px;
      transition: background 0.15s ease;
    }

    .tool-link-btn:hover {
      background-color: #e6fffa;
      text-decoration: underline;
    }

    .summary-text {
      font-size: 12px;
      color: #64748b;
    }

    /* 分类明细滚动列表 */
    .category-list-box {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      background-color: #ffffff;
      padding: 6px;
      min-height: 0;
    }

    .category-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 5px;
      margin-bottom: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .category-item:hover {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
    }

    .category-item.selected {
      background-color: #f0fdfa;
      border-color: #99f6e4;
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .category-name {
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cabinet-pill {
      font-size: 11.5px;
      padding: 2px 8px;
      border-radius: 10px;
      background-color: #f1f5f9;
      color: #475569;
      border: 1px solid #e2e8f0;
    }

    .category-item.selected .cabinet-pill {
      background-color: #ccfbf1;
      color: #0f766e;
      border-color: #99f6e4;
    }

    /* 底部按钮栏 */
    .footer-bar {
      height: 50px;
      border-top: 1px solid #e2e8f0;
      background-color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
    }

    .btn-export {
      background-color: #009688 !important;
      border-color: #009688 !important;
      color: #ffffff !important;
      font-weight: 600 !important;
      padding: 8px 18px !important;
    }

    .btn-export:hover {
      background-color: #00796b !important;
      border-color: #00796b !important;
    }

    /* 空数据提示 */
    .empty-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #94a3b8;
      font-size: 13px;
      gap: 8px;
    }

    /* 自定义 Radio 高亮样式 */
    .el-radio.is-checked .el-radio__input.is-checked .el-radio__inner {
      background-color: #009688 !important;
      border-color: #009688 !important;
    }
    .el-radio.is-checked .el-radio__label {
      color: #009688 !important;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 顶部可拖拽标题栏 -->
    <header class="window-header" @mousedown="startDrag">
      <div class="window-title">
        <i class="fa-solid fa-list-check"></i>
        <span>材料统计 - 选择分类明细表</span>
      </div>
      <div class="close-btn" @click="closeWindow" title="关闭窗口">
        <i class="fa-solid fa-xmark"></i>
      </div>
    </header>

    <!-- 主体区域 -->
    <main class="main-body">
      <!-- 提示横幅 -->
      <div class="banner-tip">
        <div class="tip-left">
          <i class="fa-solid fa-circle-info"></i>
          <span>勾选需统计的分类表，自动按【名称+型号规格】合并用量</span>
        </div>
        <div style="display: flex; align-items: center;">
          <span v-if="hasExistingPurchaseList" class="exist-badge" title="当前工作簿已有采购清单，再次导出将覆盖更新">
            <i class="fa-solid fa-rotate"></i> 已有表(将覆盖)
          </span>
          <div class="tip-badge">
            已选 {{ selectedCount }} / {{ categories.length }}
          </div>
        </div>
      </div>

      <!-- 排序规则配置卡片 -->
      <div class="sort-card">
        <div class="sort-left">
          <i class="fa-solid fa-arrow-down-short-wide"></i>
          <span>清单排序:</span>
        </div>
        <el-radio-group v-model="sortRule" size="small">
          <el-radio value="brand_name_model" label="brand_name_model">
            <span>品牌+名称+型号</span>
            <span class="default-pill">默认</span>
          </el-radio>
          <el-radio value="name_model" label="name_model">
            <span>名称+型号</span>
          </el-radio>
        </el-radio-group>
      </div>

      <!-- 工具栏 -->
      <div class="toolbar-row">
        <div class="tool-btns">
          <button class="tool-link-btn" @click="selectAll">全选</button>
          <span style="color:#cbd5e1;">|</span>
          <button class="tool-link-btn" @click="selectNone">全不选</button>
          <span style="color:#cbd5e1;">|</span>
          <button class="tool-link-btn" @click="invertSelection">反选</button>
        </div>
        <div class="summary-text">
          包含箱柜: <b style="color: #009688;">{{ totalCabinetCount }}</b> 台
        </div>
      </div>

      <!-- 分类明细滚动列表 -->
      <div class="category-list-box">
        <div
          v-for="cat in categories"
          :key="cat.sheetName"
          class="category-item"
          :class="{ selected: cat.isSelected }"
          @click="toggleItem(cat)"
        >
          <div class="item-left">
            <el-checkbox
              v-model="cat.isSelected"
              @click.stop
            ></el-checkbox>
            <span class="category-name">{{ cat.sheetName }}</span>
          </div>
          <div class="item-right">
            <span class="cabinet-pill">
              <i class="fa-solid fa-cubes-stacked" style="margin-right: 4px;"></i>
              {{ cat.cabinetCount }} 个箱柜
            </span>
          </div>
        </div>

        <!-- 暂无有效分类提示 -->
        <div v-if="categories.length === 0" class="empty-box">
          <i class="fa-regular fa-folder-open" style="font-size: 28px;"></i>
          <span>当前工作簿未检测到有效的分类明细工作表</span>
        </div>
      </div>
    </main>

    <!-- 底部操作栏 -->
    <footer class="footer-bar">
      <el-button @click="closeWindow">取消</el-button>
      <el-button
        type="primary"
        class="btn-export"
        :loading="isExporting"
        :disabled="selectedCount === 0"
        @click="submitExport"
      >
        <i class="fa-solid fa-bolt" style="margin-right: 6px;"></i>
        开始统计并生成采购清单
      </el-button>
    </footer>
  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
      setup() {
        // 分类明细列表数据
        const categories = ref([]);
        // 当前工作簿是否已存在【采购清单】工作表
        const hasExistingPurchaseList = ref(false);
        // 排序规则选项: brand_name_model (默认) 或 name_model
        const sortRule = ref('brand_name_model');
        // 导出中状态
        const isExporting = ref(false);

        // 已勾选的分类数量
        const selectedCount = computed(() => {
          return categories.value.filter(c => c.isSelected).length;
        });

        // 已勾选分类包含的总箱柜数
        const totalCabinetCount = computed(() => {
          return categories.value
            .filter(c => c.isSelected)
            .reduce((sum, c) => sum + (c.cabinetCount || 0), 0);
        });

        // 与 C# 后端安全通信
        const postToCSharp = (msgObj) => {
          try {
            if (window.chrome && window.chrome.webview) {
              window.chrome.webview.postMessage(msgObj);
            }
          } catch (err) {
            console.error('[WebMessage Error]', err);
          }
        };

        // 窗体无边框拖拽
        const startDrag = (e) => {
          if (e.button !== 0) return;
          postToCSharp({ action: 'dragWindow' });
        };

        // 关闭窗口
        const closeWindow = () => {
          postToCSharp({ action: 'closeWindow' });
        };

        // 切换单项选择
        const toggleItem = (cat) => {
          cat.isSelected = !cat.isSelected;
        };

        // 全选
        const selectAll = () => {
          categories.value.forEach(c => c.isSelected = true);
        };

        // 全不选
        const selectNone = () => {
          categories.value.forEach(c => c.isSelected = false);
        };

        // 反选
        const invertSelection = () => {
          categories.value.forEach(c => c.isSelected = !c.isSelected);
        };

        // 执行核心导出逻辑
        const doExecuteExport = (selectedNames) => {
          isExporting.value = true;
          postToCSharp({
            action: 'exportPurchaseList',
            categories: selectedNames,
            sortBy: sortRule.value
          });
        };

        // 提交导出
        const submitExport = () => {
          const selectedNames = categories.value
            .filter(c => c.isSelected)
            .map(c => c.sheetName);

          if (selectedNames.length === 0) {
            ElementPlus.ElMessage.warning('请至少勾选一个分类明细表！');
            return;
          }

          // 若当前工作簿已存在【采购清单】，使用 Element Plus 纯前端弹窗确认 (100% 零 Win32 阻塞，零 IPC 死锁)
          if (hasExistingPurchaseList.value) {
            ElementPlus.ElMessageBox.confirm(
              '当前工作簿已存在【采购清单】工作表。再次生成将基于当前勾选的分类数据全量重新生成并覆盖刷新，是否继续？',
              '重新生成确认',
              {
                confirmButtonText: '确定覆盖生成',
                cancelButtonText: '取消',
                type: 'warning',
                confirmButtonClass: 'btn-export'
              }
            ).then(() => {
              doExecuteExport(selectedNames);
            }).catch(() => {
              // 用户取消操作，不做任何改动
            });
          } else {
            doExecuteExport(selectedNames);
          }
        };

        // 初始化加载
        onMounted(() => {
          // 监听 C# 回调
          if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', (event) => {
              const res = event.data;
              if (!res || !res.action) return;

              if (res.action === 'categoriesLoaded') {
                categories.value = (res.data || []).map(item => ({
                  ...item,
                  isSelected: true
                }));
                // 感知是否存在已有【采购清单】
                if (res.hasExistingPurchaseList !== undefined) {
                  hasExistingPurchaseList.value = !!res.hasExistingPurchaseList;
                }
              } else if (res.action === 'exportFinished') {
                isExporting.value = false;
                if (res.data && res.data.success) {
                  // Element Plus 优雅且无阻塞的成功 Toast 提示
                  ElementPlus.ElMessage.success({
                    message: res.data.message || '采购清单导出成功！',
                    duration: 2500
                  });
                  // 延时 1.2 秒后平滑关闭向导窗口，保证反馈感知顺畅
                  setTimeout(() => {
                    closeWindow();
                  }, 1200);
                } else {
                  // 导出失败提示
                  ElementPlus.ElMessage.error({
                    message: res.data?.message || '导出采购清单失败！',
                    duration: 4000
                  });
                }
              }
            });
          }

          // 请求拉取分类列表
          postToCSharp({ action: 'getCategories' });
        });

        return {
          categories,
          hasExistingPurchaseList,
          sortRule,
          isExporting,
          selectedCount,
          totalCabinetCount,
          startDrag,
          closeWindow,
          toggleItem,
          selectAll,
          selectNone,
          invertSelection,
          submitExport
        };
      }
    })
    .use(ElementPlus)
    .mount('#app');
  </script>
</body>
</html>
